<ion-content class="home-content" [fullscreen]="true">

  <div class="home-container">

    <!-- ── Header con monedas y avatar ───────────────────────── -->
    <div class="header-bar">
      <div class="usuario-info">
        <div class="avatar-circle">🎮</div>
        <div class="nombre-usuario">{{ usuario?.UsuNombre || 'Jugador' }}</div>
      </div>

      <div class="monedas-badge">
        <ion-icon name="logo-bitcoin"></ion-icon>
        <span>{{ usuario?.UsuMonedasTotal || 0 | number }}</span>
      </div>
    </div>

    <!-- ── Título de bienvenida ──────────────────────────────── -->
    <div class="titulo-section">
      <h1 class="titulo-juego">PARCHÍS<span class="titulo-online">ONLINE</span></h1>
    </div>

    <!-- ── Estado de carga de salas ───────────────────────────── -->
    <div class="loading-salas" *ngIf="cargando">
      <ion-spinner name="crescent" color="warning"></ion-spinner>
      <p>Cargando salas...</p>
    </div>

    <!-- ── Overlay mientras busca partida ─────────────────────── -->
    <!-- Bloquea la pantalla para que no toque otra sala mientras
         el backend está creando la partida y cobrando la entrada -->
    <div class="buscando-overlay" *ngIf="buscandoPartida">
      <div class="buscando-card">
        <div class="dado-girando">🎲</div>
        <p>Buscando partida...</p>
      </div>
    </div>

    <!-- ── Carrusel de salas estilo cartas ───────────────────── -->
    <div class="carousel-wrapper" *ngIf="!cargando">
      <div class="carousel-track">

        <div
          class="sala-card-grande"
          *ngFor="let sala of salas"
          [class.sala-bloqueada]="usuario?.UsuMonedasTotal < sala.SalCostoEntrada"
          [ngClass]="getSalaClass(sala.SalNombre)"
          (click)="unirseASala(sala)">

          <!-- Brillo diagonal tipo carta plastificada -->
          <div class="card-shine"></div>

          <!-- Badge de precio arriba a la derecha -->
          <div class="card-badge-precio">
            <ion-icon name="logo-bitcoin"></ion-icon>
            {{ sala.SalCostoEntrada | number }}
          </div>

          <!-- Candado si no tiene monedas suficientes -->
          <div class="card-candado" *ngIf="usuario?.UsuMonedasTotal < sala.SalCostoEntrada">
            <ion-icon name="lock-closed"></ion-icon>
          </div>

          <!-- Ícono grande central según la sala -->
          <div class="card-icono-grande">{{ getSalaIcono(sala.SalNombre) }}</div>

          <!-- Nombre de la sala -->
          <div class="card-nombre">{{ sala.SalNombre }}</div>

          <!-- Footer con el premio del ganador -->
          <div class="card-premio-footer">
            <span class="premio-label">PREMIO</span>
            <div class="premio-valor">
              <ion-icon name="trophy"></ion-icon>
              <strong>{{ sala.SalPremioBase | number }}</strong>
            </div>
          </div>

        </div>

      </div>

      <!-- Puntos indicadores del carrusel -->
      <div class="scroll-dots">
        <span class="dot" *ngFor="let sala of salas"></span>
      </div>
    </div>

  </div>

  <!-- ── Barra de navegación inferior ────────────────────────── -->
  <div class="navbar-inferior">
    <div class="nav-item" (click)="irATienda()">
      <ion-icon name="storefront-outline"></ion-icon>
      <span>Tienda</span>
    </div>
    <div class="nav-item nav-activo">
      <ion-icon name="home"></ion-icon>
      <span>Home</span>
    </div>
    <div class="nav-item" (click)="irAPerfil()">
      <ion-icon name="person-outline"></ion-icon>
      <span>Perfil</span>
    </div>
  </div>

</ion-content>
