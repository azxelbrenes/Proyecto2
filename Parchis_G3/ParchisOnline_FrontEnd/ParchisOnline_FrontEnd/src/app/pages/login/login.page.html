<ion-content class="login-content" [fullscreen]="true">

  <div class="login-container">

    <!-- ── Logo y título ─────────────────────────────────────── -->
    <div class="logo-section">
      <div class="logo-icon">🎲</div>
      <h1 class="titulo">Parchís Online</h1>
      <p class="subtitulo">Iniciá sesión para jugar</p>
    </div>

    <!-- ── Formulario ────────────────────────────────────────── -->
    <div class="form-card">

      <!-- Correo -->
      <div class="input-group">
        <label class="input-label">Correo electrónico</label>
        <ion-item class="input-item" lines="none">
          <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            type="email"
            placeholder="tucorreo@gmail.com"
            [(ngModel)]="correo"
            class="custom-input">
          </ion-input>
        </ion-item>
      </div>

      <!-- Contraseña -->
      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            [type]="mostrarPassword ? 'text' : 'password'"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            class="custom-input">
          </ion-input>
          <!-- Botón para mostrar/ocultar contraseña -->
          <ion-icon
            [name]="mostrarPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            class="input-icon toggle-pass"
            (click)="togglePassword()">
          </ion-icon>
        </ion-item>
      </div>

      <!-- Mensaje de error -->
      <div class="error-msg" *ngIf="errorMsg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMsg }}
      </div>

      <!-- Botón de login -->
      <ion-button
        expand="block"
        class="btn-login"
        [disabled]="cargando"
        (click)="iniciarSesion()">
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
        <span *ngIf="!cargando">Iniciar Sesión</span>
      </ion-button>

      <!-- Separador -->
      <div class="separador">
        <span>¿No tenés cuenta?</span>
      </div>

      <!-- Botón de registro -->
      <ion-button
        expand="block"
        fill="outline"
        class="btn-registro"
        (click)="irARegistro()">
        Crear cuenta nueva
      </ion-button>

    </div>

  </div>

</ion-content>
